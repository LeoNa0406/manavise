<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>問題一覧 — ManaVise</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
    <link rel="stylesheet" th:href="@{/css/common.css}" />
</head>

<body>

    <div th:replace="~{layout/header :: navbar}"></div>

    <main class="mv-page">

        <div class="mv-breadcrumb">
            <a th:href="@{/question/categories}">ホーム</a>
            <i class="ti ti-chevron-right" style="font-size:11px" aria-hidden="true"></i>
            <span th:text="${category.categoryName}">数学</span>
        </div>

        <div class="mv-page-header" style="display:flex;align-items:flex-start;justify-content:space-between">
            <div>
                <h1 th:text="|${category.categoryName} の問題一覧|">数学 の問題一覧</h1>
                <p class="sub">問題を選んで実施してください</p>
            </div>
        </div>

        <div class="mv-table-wrap">
            <table class="mv-table">
                <thead>
                    <tr>
                        <th style="width:60px">No.</th>
                        <th>問題内容</th>
                        <th style="width:120px">カテゴリー</th>
                        <th style="width:100px">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(questions)}">
                        <td colspan="4" style="text-align:center;padding:32px;color:var(--mv-text-muted)">
                            <i class="ti ti-mood-empty" style="font-size:24px;display:block;margin-bottom:8px"></i>
                            まだ問題がありません
                        </td>
                    </tr>

                    <tr th:each="question : ${questions}">
                        <td th:text="${question.questionNumber}">1</td>
                        <td th:text="${question.questionContent}">2 + 3 × 4 を計算しなさい</td>
                        <td><span class="mv-badge cat" th:text="${category.categoryName}">数学</span></td>
                        <td>
                            <a th:href="@{/question/start(questionId=${question.questionId},categoryId=${category.categoryId})}"
                                class="mv-btn sm">
                                <i class="ti ti-player-play" aria-hidden="true"></i> 実施
                            </a>

                        </td>
                    </tr>

                </tbody>
            </table>
        </div>

        <div>
            <a th:href="@{/question/categories}" class="mv-btn mt-4">
                <i class="ti ti-arrow-left" aria-hidden="true"></i> カテゴリーに戻る
            </a>
        </div>

    </main>

</body>

</html>
