<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>結果 — ManaVise</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
    <link rel="stylesheet" th:href="@{/css/common.css}" />
    <style>
        .result-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 36px;
        }

        .result-icon.ok {
            background: #EAF3DE;
            color: #3B6D11;
        }

        .result-icon.ng {
            background: var(--mv-danger-light);
            color: #A32D2D;
        }
    </style>
</head>

<body>

    <div th:replace="~{layout/header :: navbar}"></div>

    <main class="mv-page">

        <div class="mv-breadcrumb">
            <a th:href="@{/question/categories}">ホーム</a>
            <i class="ti ti-chevron-right" style="font-size:11px" aria-hidden="true"></i>
            <a th:href="@{/question/list(categoryId=${category.categoryId})}" th:text="${category.categoryName}">数学</a>
            <i class="ti ti-chevron-right" style="font-size:11px" aria-hidden="true"></i>
            <span>結果</span>
        </div>

        <div style="text-align:center;padding:32px 0 28px">
            <div class="result-icon" th:classappend="${correct} ? 'ok' : 'ng'">
                <i class="ti" th:classappend="${correct} ? 'ti-circle-check' : 'ti-circle-x'" aria-hidden="true"></i>
            </div>
            <div style="font-size:22px;font-weight:700;margin-bottom:4px"
                th:styleappend="${correct} ? 'color:#3B6D11' : 'color:var(--mv-danger)'"
                th:text="${correct} ? '正解！' : '不正解'">正解！</div>
            <div style="font-size:13px;color:var(--mv-text-muted)" th:text="|No.${question.questionNumber} の回答結果|">No.2
                の回答結果</div>
        </div>

        <div class="mv-card" style="margin-bottom:24px">
            <div style="display:grid;gap:16px">
                <div>
                    <div
                        style="font-size:11px;font-weight:700;color:var(--mv-text-muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:6px">
                        問題</div>
                    <div style="font-size:15px;font-weight:500" th:text="${question.questionContent}">√144 の値を答えなさい
                    </div>
                </div>

                <hr style="margin:0;border-color:var(--mv-border)" />

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
                    <div>
                        <div
                            style="font-size:11px;font-weight:700;color:var(--mv-text-muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:6px">
                            あなたの回答</div>
                        <div style="font-size:16px;font-weight:700"
                            th:styleappend="${correct} ? 'color:#3B6D11' : 'color:var(--mv-danger)'"
                            th:text="${userAnswer}">12</div>
                    </div>
                    <div>
                        <div
                            style="font-size:11px;font-weight:700;color:var(--mv-text-muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:6px">
                            正解</div>
                        <div style="font-size:16px;font-weight:700" th:text="${question.answer}">12</div>
                    </div>
                </div>

            </div>
        </div>

        <!-- アクションボタン -->
        <div style="display:flex;gap:12px;justify-content:center">
            <a th:href="@{/question/list(categoryId=${category.categoryId})}" class="mv-btn">
                <i class="ti ti-list" aria-hidden="true"></i> 問題一覧に戻る
            </a>
            <a th:href="@{/history/my}" class="mv-btn primary">
                <i class="ti ti-history" aria-hidden="true"></i> 学習履歴を見る
            </a>
        </div>

    </main>

</body>

</html>
