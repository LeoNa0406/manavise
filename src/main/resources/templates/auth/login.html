<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ログイン — ManaVise</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
    <link rel="stylesheet" th:href="@{/css/common.css}" />
    <style>
        body {
            background: var(--mv-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-wrap {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-logo {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 4px;
            letter-spacing: -0.8px;
        }

        .login-logo span {
            color: var(--mv-green);
        }

        .login-tagline {
            font-size: 12px;
            color: var(--mv-text-muted);
            text-align: center;
            margin-bottom: 28px;
        }

        .login-card {
            padding: 32px;
        }

        .divider {
            height: 3px;
            width: 40px;
            background: var(--mv-green);
            border-radius: 2px;
            margin: 0 auto 24px;
        }
    </style>
</head>

<body>
    <div class="login-wrap">
        <div class="login-logo">Mana<span>Vise</span></div>
        <p class="login-tagline">学習管理システム</p>
        <div class="mv-card login-card">
            <div class="divider"></div>

            <div class="mv-alert danger" th:if="${param.error}">
                ログインIDまたはパスワードが正しくありません。
            </div>

            <form th:action="@{/auth/login}" method="post">
                <div class="mv-form-row">
                    <label for="loginId">ログインID <span class="req">*</span></label>
                    <input id="loginId" name="loginId" type="text" class="mv-input" placeholder="login_id を入力"
                        autocomplete="username" required />
                </div>

                <div class="mv-form-row">
                    <label for="loginPassword">パスワード <span class="req">*</span></label>
                    <input id="loginPassword" name="loginPassword" type="password" class="mv-input"
                        placeholder="パスワードを入力" autocomplete="current-password" required />
                </div>

                <button type="submit" class="mv-btn primary" style="width:100%;justify-content:center;margin-top:8px">
                    <i class="ti ti-login" aria-hidden="true"></i>
                    ログイン
                </button>
            </form>
        </div>
        <p style="text-align:center;font-size:11px;color:var(--mv-text-muted);margin-top:16px">
            &copy; 2026 ManaVise
        </p>
    </div>
</body>

</html>
