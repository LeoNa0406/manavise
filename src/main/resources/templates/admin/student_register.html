<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>生徒登録 — ManaVise</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
    <link rel="stylesheet" th:href="@{/css/common.css}" />
</head>

<body>

    <div th:replace="~{layout/header :: navbar}"></div>

    <main class="mv-page">

        <div class="mv-breadcrumb">
            <a th:href="@{/admin/students}">生徒管理</a>
            <i class="ti ti-chevron-right" style="font-size:11px" aria-hidden="true"></i>
            <span>新規登録</span>
        </div>

        <div class="mv-page-header">
            <h1>生徒を登録</h1>
            <p class="sub">新しい生徒アカウントを作成します</p>
        </div>

        <div class="mv-card" style="max-width:640px">
            <form th:action="@{/admin/students/new}" th:object="${studentForm}" method="post">

                <!-- バリデーションエラー表示 -->
                <div class="mv-alert danger" th:if="${#fields.hasErrors('*')}">
                    入力内容にエラーがあります。確認してください。
                </div>

                <div class="mv-form-row">
                    <label for="userName">氏名 <span class="req">*</span></label>
                    <input id="userName" type="text" th:field="*{userName}" class="mv-input" placeholder="例: 田中 太郎" />
                    <small style="color:var(--mv-danger);font-size:12px" th:if="${#fields.hasErrors('userName')}"
                        th:errors="*{userName}">
                        氏名は必須です
                    </small>
                </div>

                <div class="mv-form-row">
                    <label for="loginId">ログインID <span class="req">*</span></label>
                    <input id="loginId" type="text" th:field="*{loginId}" class="mv-input"
                        placeholder="例: taro_tanaka" />
                    <small style="color:var(--mv-danger);font-size:12px" th:if="${#fields.hasErrors('loginId')}"
                        th:errors="*{loginId}">
                        ログインIDは必須です
                    </small>
                </div>

                <div class="mv-form-row">
                    <label for="password">パスワード <span class="req">*</span></label>
                    <input id="password" type="password" th:field="*{loginPassword}" class="mv-input"
                        placeholder="パスワードを入力してください" />
                    <small style="color:var(--mv-danger);font-size:12px" th:if="${#fields.hasErrors('loginPassword')}"
                        th:errors="*{loginPassword}">
                        パスワードは必須です
                    </small>
                </div>

                <div class="mv-form-row">
                    <label>権限</label>
                    <div style="padding: 10px 0; color: var(--mv-text-muted)">一般ユーザー</div>
                    <input type="hidden" th:field="*{roleId}" value="2" />
                </div>

                <div style="display:flex;gap:10px;margin-top:8px">
                    <a th:href="@{/admin/students}" class="mv-btn">
                        <i class="ti ti-x" aria-hidden="true"></i> キャンセル
                    </a>
                    <button type="submit" class="mv-btn primary">
                        <i class="ti ti-check" aria-hidden="true"></i> 登録する
                    </button>
                </div>

            </form>
        </div>

    </main>

</body>

</html>
