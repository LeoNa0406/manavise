<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>問題編集 — ManaVise</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
    <link rel="stylesheet" th:href="@{/css/common.css}" />
    <style>
        .type-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }

        .type-tab {
            padding: 8px 20px;
            border-radius: 8px;
            border: 1.5px solid var(--mv-border);
            background: var(--mv-surface);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            color: var(--mv-text-muted);
            transition: all 0.15s;
        }

        .type-tab.active {
            border-color: var(--mv-green);
            background: var(--mv-green-light);
            color: var(--mv-green-dark);
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .choice-input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border: 1px solid var(--mv-border);
            border-radius: 8px;
            margin-bottom: 8px;
            background: var(--mv-surface);
        }

        .choice-input-row input[type="text"] {
            flex: 1;
            border: none;
            outline: none;
            font-size: 13px;
            background: transparent;
        }

        .choice-label {
            font-size: 11px;
            color: var(--mv-text-muted);
            white-space: nowrap;
        }
    </style>
</head>

<body>

    <div th:replace="~{layout/header :: navbar}"></div>

    <main class="mv-page">

        <div class="mv-breadcrumb">
            <a th:href="@{/admin/questions}">問題管理</a>
            <i class="ti ti-chevron-right" style="font-size:11px" aria-hidden="true"></i>
            <span th:text="|問題 No.${questionForm.questionNumber} を編集|">問題 No.2 を編集</span>
        </div>

        <div class="mv-page-header">
            <h1>問題を編集</h1>
            <p class="sub" th:text="|問題 No.${questionForm.questionNumber} の内容を編集します|">問題 No.2 の内容を編集します</p>
        </div>

        <div class="mv-card" style="max-width:640px">

            <form th:action="@{/admin/questions/{id}/edit(id=${questionForm.questionId})}" th:object="${questionForm}"
                method="post">

                <div class="mv-alert danger" th:if="${#fields.hasErrors('*')}">
                    入力内容にエラーがあります。確認してください。
                </div>

                <input type="hidden" th:field="*{questionId}" />

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
                    <div class="mv-form-row">
                        <label for="questionNumber">問題番号 <span class="req">*</span></label>
                        <input id="questionNumber" type="number" th:field="*{questionNumber}" class="mv-input"
                            min="1" />
                        <small style="color:var(--mv-danger);font-size:12px"
                            th:if="${#fields.hasErrors('questionNumber')}" th:errors="*{questionNumber}">
                            問題番号は必須です
                        </small>
                    </div>

                    <div class="mv-form-row">
                        <label for="categoryId">カテゴリー <span class="req">*</span></label>
                        <select id="categoryId" th:field="*{categoryId}" class="mv-select">
                            <option th:each="cat : ${categories}" th:value="${cat.categoryId}"
                                th:text="${cat.categoryName}"
                                th:selected="${cat.categoryId == questionForm.categoryId}">
                                カテゴリー名
                            </option>
                        </select>
                        <small style="color:var(--mv-danger);font-size:12px" th:if="${#fields.hasErrors('categoryId')}"
                            th:errors="*{categoryId}">
                            カテゴリーは必須です
                        </small>
                    </div>
                </div>

                <div class="mv-form-row">
                    <label for="questionContent">問題内容 <span class="req">*</span></label>
                    <textarea id="questionContent" th:field="*{questionContent}" class="mv-textarea"></textarea>
                    <small style="color:var(--mv-danger);font-size:12px" th:if="${#fields.hasErrors('questionContent')}"
                        th:errors="*{questionContent}">
                        問題内容は必須です
                    </small>
                </div>

                <div class="mv-form-row">
                    <label>問題形式 <span class="req">*</span></label>
                    <div class="type-tabs">
                        <button type="button" th:classappend="${questionForm.questionType == 1} ? 'active'"
                            class="type-tab" onclick="switchType(1, this)">
                            <i class="ti ti-pencil" aria-hidden="true"></i> 記述式
                        </button>
                        <button type="button" th:classappend="${questionForm.questionType == 2} ? 'active'"
                            class="type-tab" onclick="switchType(2, this)">
                            <i class="ti ti-list-check" aria-hidden="true"></i> 4択
                        </button>
                        <button type="button" th:classappend="${questionForm.questionType == 3} ? 'active'"
                            class="type-tab" onclick="switchType(3, this)">
                            <i class="ti ti-circle-check" aria-hidden="true"></i> ○×
                        </button>
                    </div>
                    <input type="hidden" th:field="*{questionType}" id="questionTypeInput" />
                </div>

                <div id="section-1" class="section" th:classappend="${questionForm.questionType == 1} ? 'active'">
                    <div class="mv-form-row">
                        <label>正解 <span class="req">*</span></label>
                        <input type="text" th:field="*{answer}" class="mv-input" placeholder="正解を入力してください" />
                        <small style="color:var(--mv-danger);font-size:12px" th:errors="*{answer}"></small>
                    </div>
                </div>

                <div id="section-2" class="section" th:classappend="${questionForm.questionType == 2} ? 'active'">
                    <div class="mv-form-row">
                        <label>選択肢 <span class="req">*</span>
                            <span style="font-size:11px;font-weight:400;color:var(--mv-text-muted)">
                                — 正解を選択してください（1つだけ）
                            </span>
                        </label>

                        <div th:each="i : ${#numbers.sequence(0, 3)}">
                            <div class="choice-input-row">
                                <input type="hidden" th:name="|choices[${i}].choiceOrder|" th:value="${i + 1}" />

                                <input type="hidden" th:name="|choices[${i}].correct|" th:id="|multiCorrect${i}|"
                                    th:value="${questionForm.choices.size() > i and questionForm.choices[i].correct ? 'true' : 'false'}" />

                                <span class="choice-label" th:text="${'ABCD'.charAt(i)}">A</span>

                                <input type="text" th:name="|choices[${i}].choiceText|"
                                    th:value="${questionForm.choices.size() > i ? questionForm.choices[i].choiceText : ''}"
                                    placeholder="選択肢を入力" />

                                <span class="choice-label">正解</span>

                                <input type="radio" name="correctChoiceIndex" th:value="${i}"
                                    th:checked="${questionForm.choices.size() > i and questionForm.choices[i].correct}"
                                    th:onchange="|updateMultiCorrect(${i})|"
                                    style="accent-color:var(--mv-green);width:16px;height:16px;" />
                            </div>
                        </div>
                    </div>
                </div>



                <div style="display:flex;gap:10px;margin-top:8px">
                    <a th:href="@{/admin/questions}" class="mv-btn">
                        <i class="ti ti-x" aria-hidden="true"></i> キャンセル
                    </a>
                    <button type="submit" class="mv-btn primary">
                        <i class="ti ti-check" aria-hidden="true"></i> 更新する
                    </button>
                </div>

            </form>
        </div>

    </main>

    <script>
        function switchType(type, btn) {
            document.querySelectorAll('.type-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById('section-' + type).classList.add('active');
            document.getElementById('questionTypeInput').value = type;
        }

        function updateMultiCorrect(selectedIndex) {
            for (let i = 0; i < 4; i++) {
                const el = document.getElementById('multiCorrect' + i);
                if (el) el.value = (i === selectedIndex) ? 'true' : 'false';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const currentType = parseInt(document.getElementById('questionTypeInput').value) || 1;
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById('section-' + currentType).classList.add('active');
        });
    </script>

</body>

</html>
