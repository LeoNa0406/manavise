<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>生徒履歴 — ManaVise</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
    <link rel="stylesheet" th:href="@{/css/common.css}" />
</head>

<body>

    <div th:replace="~{layout/header :: navbar}"></div>

    <main class="mv-page">

        <div class="mv-breadcrumb">
            <a th:href="@{/admin/students}">生徒管理</a>
            <i class="ti ti-chevron-right" style="font-size:11px" aria-hidden="true"></i>
            <span th:text="|${targetUser.userName} の履歴|">田中 花子 の履歴</span>
        </div>

        <div class="mv-page-header" style="display:flex;align-items:flex-start;justify-content:space-between">
            <div>
                <h1 th:text="|${targetUser.userName} — 学習履歴|">田中 花子 — 学習履歴</h1>
                <p class="sub">この生徒が取り組んだ問題の履歴一覧</p>
            </div>
            <a th:href="@{/admin/students}" class="mv-btn">
                <i class="ti ti-arrow-left" aria-hidden="true"></i> 生徒一覧に戻る
            </a>
        </div>

        <div class="mv-table-wrap">
            <table class="mv-table">
                <thead>
                    <tr>
                        <th style="width:160px">実施日時</th>
                        <th style="width:110px">カテゴリー</th>
                        <th style="width:80px">問題No.</th>
                        <th>問題内容</th>
                        <th style="width:120px">あなたの回答</th>
                        <th style="width:100px">正解</th>
                        <th style="width:100px">結果</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="h : ${historyList}">
                        <td style="color:var(--mv-text-muted);font-size:12px"
                            th:text="${#temporals.format(h.executedAt,'yyyy/MM/dd HH:mm')}">2026/05/25 14:32</td>
                        <td><span class="mv-badge cat" th:text="${h.categoryName}">数学</span></td>
                        <td style="font-weight:500" th:text="|No.${h.questionNumber}|">No.2</td>
                        <td th:text="${h.questionContent}">√144 の値を答えなさい</td>
                        <td th:text="${h.userAnswer}" th:styleappend="${!h.isCorrect} ? 'color:var(--mv-danger)'">12
                        </td>
                        <td th:text="${h.correctAnswer}">12</td>
                        <td>
                            <span th:if="${h.isCorrect}" class="mv-badge ok">正解</span>
                            <span th:if="${!h.isCorrect}" class="mv-badge ng">不正解</span>
                        </td>
                    </tr>

                </tbody>
            </table>
        </div>

    </main>

</body>

</html>
